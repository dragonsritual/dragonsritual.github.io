<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1180" preserveAspectRatio="none">
  <defs>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#020502" flood-opacity="0.78"/>
    </filter>
  </defs>

  <!-- PASS 07: intentionally FLAT fantasy chassis. No bone tubes, no inflated nodes. -->
  <g fill="none" stroke-linecap="square" stroke-linejoin="miter" filter="url(#softShadow)">
    <!-- outer frame: dark under-edge, green body, pale etched edge -->
    <path d="M31 44 H1169 V1136 H31 Z" stroke="#071008" stroke-width="28"/>
    <path d="M31 44 H1169 V1136 H31 Z" stroke="#71896f" stroke-width="18"/>
    <path d="M40 53 H1160 V1127 H40 Z" stroke="#d8e4d6" stroke-opacity=".82" stroke-width="3"/>

    <!-- header separator -->
    <path d="M46 166 H1154" stroke="#071008" stroke-width="24"/>
    <path d="M46 166 H1154" stroke="#789276" stroke-width="14"/>
    <path d="M48 161 H1152" stroke="#e0ebe0" stroke-opacity=".72" stroke-width="2.5"/>
    <path d="M48 171 H1152" stroke="#263b2b" stroke-width="3"/>

    <!-- main vertical spine -->
    <path d="M706 166 V1133" stroke="#071008" stroke-width="28"/>
    <path d="M706 166 V1133" stroke="#6f896f" stroke-width="17"/>
    <path d="M700 172 V1127" stroke="#dce8dc" stroke-opacity=".76" stroke-width="3"/>
    <path d="M713 172 V1127" stroke="#203625" stroke-width="3"/>

    <!-- right stack split -->
    <path d="M706 430 H1154" stroke="#071008" stroke-width="22"/>
    <path d="M706 430 H1154" stroke="#748d73" stroke-width="13"/>
    <path d="M710 425 H1150" stroke="#dbe7da" stroke-opacity=".66" stroke-width="2"/>

    <!-- lower rails -->
    <path d="M46 710 H1154" stroke="#071008" stroke-width="24"/>
    <path d="M46 710 H1154" stroke="#748d73" stroke-width="14"/>
    <path d="M49 705 H1151" stroke="#dce8db" stroke-opacity=".68" stroke-width="2.5"/>

    <path d="M46 934 H1154" stroke="#071008" stroke-width="24"/>
    <path d="M46 934 H1154" stroke="#748d73" stroke-width="14"/>
    <path d="M49 929 H1151" stroke="#dce8db" stroke-opacity=".68" stroke-width="2.5"/>
  </g>

  <!-- flat red inlay details; decorative, not structural -->
  <g fill="#55141d" stroke="#a64851" stroke-width="2">
    <rect x="697" y="200" width="18" height="56" rx="2"/>
    <rect x="697" y="514" width="18" height="66" rx="2"/>
    <rect x="697" y="784" width="18" height="64" rx="2"/>
    <rect x="697" y="1000" width="18" height="58" rx="2"/>
  </g>

  <!-- small, flat intersection plates instead of star/vertebra nodes -->
  <g fill="#18231b" stroke="#9eb19d" stroke-width="5">
    <rect x="687" y="147" width="38" height="38" transform="rotate(45 706 166)"/>
    <rect x="690" y="414" width="32" height="32" transform="rotate(45 706 430)"/>
    <rect x="687" y="691" width="38" height="38" transform="rotate(45 706 710)"/>
    <rect x="690" y="918" width="32" height="32" transform="rotate(45 706 934)"/>
  </g>
  <g fill="#76202a" stroke="#321016" stroke-width="3">
    <circle cx="706" cy="166" r="8"/>
    <circle cx="706" cy="430" r="7"/>
    <circle cx="706" cy="710" r="8"/>
    <circle cx="706" cy="934" r="7"/>
  </g>

  <!-- tiny engraved corner cuts; keep fantasy character without blocking content -->
  <g fill="none" stroke="#c8d7c7" stroke-width="4" opacity=".72">
    <path d="M46 78 H75 V49"/><path d="M1154 78 H1125 V49"/>
    <path d="M46 1102 H75 V1131"/><path d="M1154 1102 H1125 V1131"/>
  </g>
</svg>
